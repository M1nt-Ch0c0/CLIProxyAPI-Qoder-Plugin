name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: golang:bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build linux/amd64 c-shared plugin
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist

          OUT="dist/qoder-${TAG}.so"
          go build -trimpath -buildvcs=false -buildmode=c-shared \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${OUT}" .

          # Verify output is a Linux shared library (not a regular executable)
          readelf -h "${OUT}" | grep -q "DYN (Shared object file)"
          test -s "${OUT}"

          # Also package CPA Plugin Store zip: qoder_{version}_linux_amd64.zip
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip >/dev/null
          mkdir -p dist/pkg
          cp "${OUT}" dist/pkg/qoder.so
          (cd dist/pkg && zip -9 -q "../qoder_${VERSION}_linux_amd64.zip" qoder.so)
          rm -rf dist/pkg

          (cd dist && sha256sum "qoder-${TAG}.so" "qoder_${VERSION}_linux_amd64.zip" > checksums.txt)
          cat dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/qoder-${{ github.ref_name }}.so
            dist/qoder_*_linux_amd64.zip
            dist/checksums.txt
